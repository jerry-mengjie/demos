name: Fullstack CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend
        run: npm install
        working-directory: React

      - name: Build frontend
        run: npm run build
        working-directory: React

      - name: Install backend
        run: npm install
        working-directory: Nestjs

      - name: Build backend
        run: npm run build
        working-directory: Nestjs
