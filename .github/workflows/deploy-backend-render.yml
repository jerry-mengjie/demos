name: Deploy Backend to Render

on:
  push:
    branches: ["main"]
    paths:
      - "Nestjs/**"
      - ".github/workflows/deploy-backend-render.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
